<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#141210">
<title>칼림바 튜너 (17키)</title>
<style>
  :root{
    --bg:#141210;
    --card:#1f1b17;
    --card-2:#26201b;
    --wood:#c98a4b;
    --wood-2:#e0a869;
    --text:#f3ece2;
    --sub:#a89886;
    --ok:#5fd68a;
    --warn:#f0c85a;
    --bad:#ef6a5f;
    --tine:#d9d2c4;
    --tine-active:#e0a869;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    overscroll-behavior:none;}
  body{min-height:100vh; padding-bottom:env(safe-area-inset-bottom);}
  .wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px;}
  header{text-align:center;padding:14px 0 6px;}
  header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em;}
  header p{margin:4px 0 0;color:var(--sub);font-size:12.5px;}

  .card{background:linear-gradient(180deg,var(--card),var(--card-2));border-radius:18px;padding:18px;margin-bottom:14px;
    box-shadow:0 6px 20px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.03);}

  /* Tuner display */
  .status-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;}
  .mode-badge{font-size:11px;color:var(--sub);background:rgba(255,255,255,.05);padding:3px 9px;border-radius:100px;}
  .target-label{font-size:11px;color:var(--sub);}
  .note-display{text-align:center;padding:6px 0 2px;}
  .note-name{font-size:64px;font-weight:800;line-height:1;letter-spacing:-.01em;transition:color .15s;}
  .note-sub{font-size:14px;color:var(--sub);margin-top:6px;}
  .note-sub b{color:var(--text);font-weight:600;}

  .meter{position:relative;height:54px;margin:14px 4px 6px;}
  .meter-track{position:absolute;left:0;right:0;top:22px;height:10px;border-radius:6px;
    background:linear-gradient(90deg, var(--bad) 0%, var(--warn) 22%, var(--ok) 42%, var(--ok) 58%, var(--warn) 78%, var(--bad) 100%);
    opacity:.35;}
  .meter-center{position:absolute;left:50%;top:14px;width:2px;height:26px;background:rgba(255,255,255,.5);transform:translateX(-1px);}
  .meter-needle{position:absolute;top:6px;width:4px;height:42px;border-radius:3px;background:var(--wood-2);
    left:50%;transform:translateX(-2px);transition:left .08s linear,background-color .1s;box-shadow:0 0 8px rgba(224,168,105,.7);}
  .meter-scale{display:flex;justify-content:space-between;font-size:10px;color:var(--sub);padding:0 2px;}

  .cents-text{text-align:center;font-size:15px;margin-top:6px;color:var(--sub);}
  .cents-text b{font-size:20px;}
  .hint{text-align:center;font-size:13.5px;margin-top:8px;min-height:20px;font-weight:600;}
  .hint.flat{color:var(--bad);}
  .hint.sharp{color:var(--bad);}
  .hint.ok{color:var(--ok);}
  .hint.idle{color:var(--sub);font-weight:400;}

  .mic-btn{display:block;width:100%;margin-top:4px;padding:14px;border:none;border-radius:14px;
    font-size:16px;font-weight:700;background:var(--wood);color:#241a0f;cursor:pointer;}
  .mic-btn.listening{background:#3a332b;color:var(--wood-2);border:1px solid var(--wood);}
  .mic-btn:active{transform:scale(.98);}

  /* Kalimba tine visual */
  .kalimba{background:linear-gradient(180deg,#2b2018,#1b140e);border-radius:18px;padding:20px 0 8px;position:relative;}
  .kalimba::before{content:"";position:absolute;left:10%;right:10%;bottom:8px;height:40%;
    background:radial-gradient(ellipse at center, rgba(201,138,75,.18), transparent 70%);pointer-events:none;}
  .tines-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;
    padding:0 14px 10px;position:relative;z-index:1;}
  .tines{display:flex;align-items:flex-end;gap:4px;width:max-content;margin:0 auto;}
  .tine{flex:0 0 auto;width:34px;background:linear-gradient(180deg,var(--tine),#b7ad9a);border-radius:5px 5px 3px 3px;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;
    font-size:11px;color:#2a2418;font-weight:700;cursor:pointer;border:none;position:relative;
    scroll-snap-align:center;box-shadow:0 3px 6px rgba(0,0,0,.4);}
  .tine .num{opacity:.55;font-size:9px;margin-bottom:2px;}
  .tine.active{background:linear-gradient(180deg,var(--tine-active),#b9793a);color:#241a0f;box-shadow:0 0 0 2px var(--wood-2),0 3px 8px rgba(0,0,0,.5);}
  .tine.detected{outline:2px solid var(--ok);}
  .scroll-hint{text-align:center;font-size:11.5px;color:var(--sub);padding-top:2px;position:relative;z-index:1;}

  .auto-toggle{display:flex;gap:8px;margin-top:14px;}
  .auto-toggle button{flex:1;padding:9px;border-radius:10px;border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.04);color:var(--sub);font-size:13px;font-weight:600;cursor:pointer;}
  .auto-toggle button.active{background:var(--wood);color:#241a0f;border-color:var(--wood);}

  /* Settings */
  details.settings{background:var(--card);border-radius:14px;padding:2px 16px;}
  details.settings summary{padding:12px 0;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer;list-style:none;}
  details.settings summary::-webkit-details-marker{display:none;}
  details.settings summary::after{content:"▾";float:right;}
  details.settings[open] summary::after{content:"▴";}
  .setting-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.06);}
  .setting-row label{font-size:13.5px;color:var(--text);}
  .setting-row input[type=number]{width:70px;background:#141210;border:1px solid rgba(255,255,255,.12);
    color:var(--text);border-radius:8px;padding:6px 8px;font-size:14px;text-align:center;}
  .setting-row input[type=range]{width:120px;}
  .preset-select{width:100%;padding:9px;background:#141210;border:1px solid rgba(255,255,255,.12);color:var(--text);
    border-radius:9px;font-size:13.5px;margin-top:8px;}
  .key-table{margin-top:10px;border-top:1px solid rgba(255,255,255,.06);padding-top:8px;}
  .key-row{display:grid;grid-template-columns:34px 1fr 90px;gap:8px;align-items:center;padding:5px 0;font-size:13px;}
  .key-row span{color:var(--sub);}
  .key-row select{background:#141210;border:1px solid rgba(255,255,255,.12);color:var(--text);border-radius:7px;padding:5px;font-size:12.5px;}
  .reset-btn{margin-top:12px;width:100%;padding:9px;border-radius:9px;border:1px solid rgba(239,106,95,.4);
    background:rgba(239,106,95,.08);color:var(--bad);font-size:13px;font-weight:600;cursor:pointer;}

  footer{text-align:center;color:var(--sub);font-size:11px;margin-top:18px;line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🪕 칼림바 튜너</h1>
    <p>17키 칼림바 전용 · 마이크로 음을 듣고 실시간으로 조율을 도와드려요</p>
  </header>

  <div class="card">
    <div class="status-row">
      <span class="mode-badge" id="modeBadge">자동 감지</span>
      <span class="target-label" id="targetLabel"></span>
    </div>
    <div class="note-display">
      <div class="note-name" id="noteName">--</div>
      <div class="note-sub" id="noteSub">마이크를 켜고 음을 튕겨보세요</div>
    </div>

    <div class="meter">
      <div class="meter-track"></div>
      <div class="meter-center"></div>
      <div class="meter-needle" id="needle"></div>
    </div>
    <div class="meter-scale"><span>-50¢</span><span>0</span><span>+50¢</span></div>

    <div class="cents-text" id="centsText">&nbsp;</div>
    <div class="hint idle" id="hintText">대기 중</div>

    <button class="mic-btn" id="micBtn">🎤 마이크 켜기</button>
  </div>

  <div class="card kalimba">
    <div class="tines-scroll" id="tinesScroll">
      <div class="tines" id="tines"></div>
    </div>
    <div class="scroll-hint">← 좌우로 밀어서 다른 키 보기 →</div>
    <div class="auto-toggle">
      <button id="autoBtn" class="active">자동 감지</button>
      <button id="manualBtn">키 선택 고정</button>
    </div>
  </div>

  <details class="settings">
    <summary>⚙ 설정 · 각 키 음 수정</summary>
    <div class="setting-row">
      <label>기준음 A4 (Hz)</label>
      <input type="number" id="a4Input" value="440" min="415" max="466" step="1">
    </div>
    <label style="font-size:12.5px;color:var(--sub);">튜닝 프리셋</label>
    <select class="preset-select" id="presetSelect">
      <option value="c-major">C 메이저 (표준 17키)</option>
      <option value="custom">사용자 지정</option>
    </select>
    <div class="key-table" id="keyTable"></div>
    <button class="reset-btn" id="resetBtn">기본 튜닝으로 초기화</button>
  </details>

  <footer>
    ⚠ 마이크 사용은 HTTPS(또는 localhost) 환경에서만 동작합니다.<br>
    조용한 곳에서 한 키씩 또렷하게 튕겨주세요.
  </footer>
</div>

<script>
(function(){
  "use strict";

  // ---------- 17-key standard C-major kalimba layout (physical left→right) ----------
  var DEFAULT_NOTES = ["D6","B5","G5","E5","C5","A4","F4","D4","C4","E4","G4","B4","D5","F5","A5","C6","E6"];
  var NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

  var state = {
    a4: 440,
    notes: DEFAULT_NOTES.slice(),
    mode: "auto", // "auto" | "manual"
    selectedKey: 8, // center key index
    listening: false,
    freqHistory: [],
    lastGoodFreq: null,
    lastGoodTime: 0,
    noteCandidate: null,
    noteCandidateCount: 0,
    lockedNote: null
  };

  function noteToMidi(name){
    var m = name.match(/^([A-G]#?)(\d)$/);
    if(!m) return 69;
    var idx = NOTE_NAMES.indexOf(m[1]);
    var oct = parseInt(m[2],10);
    return (oct+1)*12 + idx;
  }
  function midiToFreq(midi){
    return state.a4 * Math.pow(2, (midi-69)/12);
  }
  function noteToFreq(name){ return midiToFreq(noteToMidi(name)); }
  function freqToMidiFloat(freq){
    return 69 + 12*Math.log2(freq/state.a4);
  }
  function midiToNoteName(midi){
    var idx = ((Math.round(midi)%12)+12)%12;
    var oct = Math.floor(Math.round(midi)/12)-1;
    return NOTE_NAMES[idx]+oct;
  }

  // ---------- Build octave options for dropdowns ----------
  function allNoteOptions(){
    var out=[];
    for(var o=3;o<=7;o++){
      for(var i=0;i<12;i++) out.push(NOTE_NAMES[i]+o);
    }
    return out;
  }

  // ---------- Render tines ----------
  var tinesEl = document.getElementById("tines");
  var centerIdx = 8;
  function renderTines(){
    tinesEl.innerHTML="";
    for(var i=0;i<17;i++){
      (function(i){
        var offset = Math.abs(i-centerIdx);
        var h = 130 - offset*10; // taller near center
        var btn = document.createElement("button");
        btn.className = "tine" + (state.mode==="manual" && state.selectedKey===i ? " active":"");
        btn.style.height = h+"px";
        btn.dataset.idx = i;
        btn.innerHTML = '<span class="num">'+(i+1)+'</span><span>'+state.notes[i]+'</span>';
        btn.addEventListener("click", function(){
          state.mode = "manual";
          state.selectedKey = i;
          updateModeButtons();
          renderTines();
          updateTargetLabel();
        });
        tinesEl.appendChild(btn);
        if(i===centerIdx && !renderTines._centered){
          renderTines._centered = true;
          requestAnimationFrame(function(){ btn.scrollIntoView({inline:"center", block:"nearest"}); });
        }
      })(i);
    }
  }

  function updateTargetLabel(){
    var lbl = document.getElementById("targetLabel");
    var modeBadge = document.getElementById("modeBadge");
    if(state.mode==="manual"){
      modeBadge.textContent = "키 "+(state.selectedKey+1)+" 고정";
      lbl.textContent = "목표: "+state.notes[state.selectedKey]+" ("+noteToFreq(state.notes[state.selectedKey]).toFixed(1)+" Hz)";
    } else {
      modeBadge.textContent = "자동 감지";
      lbl.textContent = "";
    }
  }

  function updateModeButtons(){
    document.getElementById("autoBtn").classList.toggle("active", state.mode==="auto");
    document.getElementById("manualBtn").classList.toggle("active", state.mode==="manual");
  }
  document.getElementById("autoBtn").addEventListener("click", function(){
    state.mode="auto"; updateModeButtons(); renderTines(); updateTargetLabel();
  });
  document.getElementById("manualBtn").addEventListener("click", function(){
    state.mode="manual"; updateModeButtons(); renderTines(); updateTargetLabel();
  });

  // ---------- Settings panel: key table ----------
  var keyTableEl = document.getElementById("keyTable");
  function renderKeyTable(){
    keyTableEl.innerHTML="";
    var opts = allNoteOptions();
    for(var i=0;i<17;i++){
      (function(i){
        var row = document.createElement("div");
        row.className = "key-row";
        var optsHtml = opts.map(function(n){
          return '<option value="'+n+'"'+(n===state.notes[i]?" selected":"")+'>'+n+'</option>';
        }).join("");
        row.innerHTML = '<span>#'+(i+1)+'</span><span>키 '+(i+1)+'</span><select data-idx="'+i+'">'+optsHtml+'</select>';
        keyTableEl.appendChild(row);
        row.querySelector("select").addEventListener("change", function(e){
          state.notes[i] = e.target.value;
          document.getElementById("presetSelect").value = "custom";
          renderTines();
          updateTargetLabel();
        });
      })(i);
    }
  }

  document.getElementById("resetBtn").addEventListener("click", function(){
    state.notes = DEFAULT_NOTES.slice();
    document.getElementById("presetSelect").value = "c-major";
    renderTines(); renderKeyTable(); updateTargetLabel();
  });
  document.getElementById("presetSelect").addEventListener("change", function(e){
    if(e.target.value==="c-major"){
      state.notes = DEFAULT_NOTES.slice();
      renderTines(); renderKeyTable(); updateTargetLabel();
    }
  });
  document.getElementById("a4Input").addEventListener("change", function(e){
    var v = parseFloat(e.target.value);
    if(v>=415 && v<=466){ state.a4 = v; updateTargetLabel(); }
  });

  renderTines();
  renderKeyTable();
  updateTargetLabel();

  // ---------- Audio / pitch detection ----------
  var audioCtx=null, analyser=null, mediaStream=null, rafId=null;
  var buf=null;

  // Returns {freq, confidence} for a clear periodic pitch, or null (too quiet / not tonal).
  // confidence is a normalized autocorrelation coefficient (~1 = very pure tone, ~0 = noise).
  function autoCorrelate(buf, sampleRate){
    var SIZE = buf.length;
    var rms = 0;
    for(var i=0;i<SIZE;i++){ rms += buf[i]*buf[i]; }
    rms = Math.sqrt(rms/SIZE);
    if(rms < 0.012) return null; // too quiet

    // Kalimba keys (incl. custom C3-C7 range) sit well within 100-2200 Hz.
    var minFreq = 100, maxFreq = 2200;
    var minLag = Math.floor(sampleRate/maxFreq);
    var maxLag = Math.min(Math.ceil(sampleRate/minFreq), SIZE-2);

    var bestLag=-1, bestNorm=-1;
    var c = new Float32Array(maxLag+2);
    for(var lag=minLag; lag<=maxLag; lag++){
      var sum=0, eA=0, eB=0;
      var n = SIZE-lag;
      for(var j=0;j<n;j++){
        var a=buf[j], b=buf[j+lag];
        sum += a*b; eA += a*a; eB += b*b;
      }
      c[lag] = sum;
      var denom = Math.sqrt(eA*eB);
      var norm = denom>0 ? sum/denom : 0;
      if(norm>bestNorm){ bestNorm=norm; bestLag=lag; }
    }
    if(bestLag<=minLag || bestLag>=maxLag) return null;

    var x1=c[bestLag-1], x2=c[bestLag], x3=c[bestLag+1];
    var a2=(x1+x3-2*x2)/2, b2=(x3-x1)/2;
    var refinedLag = bestLag;
    if(a2!==0) refinedLag = bestLag - b2/(2*a2);
    if(refinedLag<=0) return null;
    return { freq: sampleRate/refinedLag, confidence: bestNorm };
  }

  function medianSmooth(freq){
    state.freqHistory.push(freq);
    if(state.freqHistory.length>7) state.freqHistory.shift();
    var sorted = state.freqHistory.slice().sort(function(a,b){return a-b;});
    return sorted[Math.floor(sorted.length/2)];
  }

  var noteName=document.getElementById("noteName"), noteSub=document.getElementById("noteSub"),
      needle=document.getElementById("needle"), centsText=document.getElementById("centsText"),
      hintText=document.getElementById("hintText");

  var CONFIDENCE_MIN = 0.9;   // reject noise / inharmonic buzz
  var HOLD_MS = 2200;         // keep showing the last good reading while a note rings out

  function clearDetectionState(){
    state.lastGoodFreq = null;
    state.lastGoodTime = 0;
    state.noteCandidate = null;
    state.noteCandidateCount = 0;
    state.lockedNote = null;
    state.freqHistory = [];
  }

  function renderWaiting(msg){
    noteName.textContent="--"; noteName.style.color="var(--text)";
    noteSub.textContent = msg;
    centsText.innerHTML="&nbsp;";
    hintText.textContent="대기 중"; hintText.className="hint idle";
    needle.style.left="50%"; needle.style.background="var(--wood-2)";
    document.querySelectorAll(".tine").forEach(function(t){t.classList.remove("detected");});
  }

  function resetDisplay(){
    clearDetectionState();
    renderWaiting("마이크를 켜고 음을 튕겨보세요");
  }

  function renderResult(freq, holding){
    var targetMidi, targetFreq, detectedLabel;
    if(state.mode==="manual"){
      targetFreq = noteToFreq(state.notes[state.selectedKey]);
      targetMidi = noteToMidi(state.notes[state.selectedKey]);
      detectedLabel = state.notes[state.selectedKey];
    } else {
      targetMidi = state.lockedNote;
      targetFreq = midiToFreq(targetMidi);
      detectedLabel = midiToNoteName(targetMidi);
      // highlight matching physical key if it matches one of the 17 notes
      document.querySelectorAll(".tine").forEach(function(t){
        var idx = parseInt(t.dataset.idx,10);
        t.classList.toggle("detected", state.notes[idx]===detectedLabel);
      });
    }

    var cents = 1200 * Math.log2(freq/targetFreq);
    cents = Math.max(-60, Math.min(60, cents));

    noteName.textContent = detectedLabel;
    noteSub.innerHTML = "감지: <b>"+freq.toFixed(1)+" Hz</b> · 목표: <b>"+targetFreq.toFixed(1)+" Hz</b>";

    var pct = 50 + (cents/60)*50;
    pct = Math.max(2, Math.min(98, pct));
    needle.style.left = pct+"%";

    var absCents = Math.abs(cents);
    var color, hintClass, hintMsg;
    if(absCents < 5){
      color="var(--ok)"; hintClass="ok"; hintMsg="✓ 정확해요!";
      noteName.style.color="var(--ok)";
    } else if(cents < 0){
      color = absCents<15 ? "var(--warn)" : "var(--bad)";
      hintClass = "flat"; hintMsg = "▲ 음을 조금 올리세요 (핀을 밀어주세요)";
      noteName.style.color = "var(--text)";
    } else {
      color = absCents<15 ? "var(--warn)" : "var(--bad)";
      hintClass = "sharp"; hintMsg = "▼ 음을 조금 내리세요 (핀을 당겨주세요)";
      noteName.style.color = "var(--text)";
    }
    needle.style.background = color;
    centsText.innerHTML = (cents>=0?"+":"")+"<b>"+cents.toFixed(0)+"</b> cents";
    hintText.textContent = hintMsg + (holding ? " · 여운 유지 중" : "");
    hintText.className = "hint "+hintClass;
  }

  function processAudio(){
    analyser.getFloatTimeDomainData(buf);
    var result = autoCorrelate(buf, audioCtx.sampleRate);
    var now = performance.now();

    if(!result || result.confidence < CONFIDENCE_MIN){
      if(state.lastGoodFreq !== null && (now - state.lastGoodTime) < HOLD_MS){
        renderResult(state.lastGoodFreq, true); // keep last reading visible while note rings out
      } else {
        clearDetectionState();
        renderWaiting("소리를 기다리는 중...");
      }
      rafId = requestAnimationFrame(processAudio);
      return;
    }

    var freq = medianSmooth(result.freq);
    state.lastGoodFreq = freq;
    state.lastGoodTime = now;

    if(state.mode==="auto"){
      var candidate = Math.round(freqToMidiFloat(freq));
      if(candidate === state.noteCandidate){
        state.noteCandidateCount++;
      } else {
        state.noteCandidate = candidate;
        state.noteCandidateCount = 1;
      }
      // require 2 consistent frames before switching the displayed note, to avoid flicker
      if(state.lockedNote===null || state.noteCandidateCount>=2){
        state.lockedNote = candidate;
      }
    }

    renderResult(freq, false);
    rafId = requestAnimationFrame(processAudio);
  }

  var micBtn = document.getElementById("micBtn");
  micBtn.addEventListener("click", function(){
    if(state.listening){ stopMic(); } else { startMic(); }
  });

  function startMic(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      alert("이 브라우저는 마이크 접근을 지원하지 않아요. HTTPS 주소로 접속했는지 확인해주세요.");
      return;
    }
    navigator.mediaDevices.getUserMedia({
      audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false }
    }).then(function(stream){
      mediaStream = stream;
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==="suspended") audioCtx.resume();
      var source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      buf = new Float32Array(analyser.fftSize);
      source.connect(analyser);

      state.listening = true;
      micBtn.textContent = "⏹ 마이크 끄기";
      micBtn.classList.add("listening");
      clearDetectionState();
      renderWaiting("소리를 기다리는 중...");
      processAudio();
    }).catch(function(err){
      alert("마이크 권한을 허용해주세요.\n("+err.message+")");
    });
  }

  function stopMic(){
    state.listening = false;
    micBtn.textContent = "🎤 마이크 켜기";
    micBtn.classList.remove("listening");
    if(rafId) cancelAnimationFrame(rafId);
    if(mediaStream) mediaStream.getTracks().forEach(function(t){t.stop();});
    if(audioCtx) audioCtx.close();
    audioCtx=null; analyser=null; mediaStream=null;
    resetDisplay();
  }
})();
</script>
</body>
</html>
